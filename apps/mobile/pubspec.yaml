name: cumavi_pos_mobile
description: "Cumavi POS — punto de venta móvil para vendedores de Cumavi Shop."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  equatable: ^3.0.0
  esc_pos_utils_plus: ^2.0.4
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  gal: ^2.3.3
  get_it: ^9.2.1
  go_router: ^18.0.1
  image_background_remover: ^2.0.1
  image_picker: ^1.2.3
  intl: ^0.20.3
  mobile_scanner: ^7.4.2
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  pdf: ^3.13.0
  # 13.x needs compileSdk 37, which the Android Gradle plugin bundled with
  # Flutter 3.47 (AGP 9.1) cannot resolve yet. Revisit after a Flutter upgrade.
  permission_handler: ^12.0.1
  print_bluetooth_thermal: ^1.2.4
  printing: ^5.15.0
  share_plus: ^13.3.0
  url_launcher: ^6.3.2

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # Builds AppLocalizations from lib/l10n (see l10n.yaml).
  generate: true
  assets:
    - assets/brand/
    - assets/icons/
    - assets/images/products/
    - assets/images/demo/

  # Outfit ships with the app so the POS renders correctly offline.
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
