name: Web

on:
  push:
    branches: [main]
    paths: ['apps/web/**', 'packages/**', 'pnpm-lock.yaml', 'package.json', '.github/workflows/web.yml']
  pull_request:
    paths: ['apps/web/**', 'packages/**', 'pnpm-lock.yaml', 'package.json', '.github/workflows/web.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cumavi-pos/web lint
      - run: pnpm --filter @cumavi-pos/web typecheck
      - run: pnpm --filter @cumavi-pos/web test
      - run: pnpm --filter @cumavi-pos/web build
